<!DOCTYPE html>
<html lang="zh-TW" class="h-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>登入 - 揪行 JooGO</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        },
                        ui: {
                            bg: '#f8fafc',
                            title: '#0f172a',
                            subtitle: '#64748b',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        html, body {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: auto;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
    </style>
</head>
<body class="bg-[#f8fafc] text-ui-title antialiased flex flex-col justify-between">

    <div class="shrink-0 h-4 sm:h-8 w-full"></div>

    <main class="w-full max-w-sm mx-auto px-6 flex flex-col items-center justify-center">
        <div class="w-full bg-white rounded-[28px] p-7 sm:p-8 shadow-sm border border-slate-200/80 flex flex-col items-center text-center">
            
            <div class="w-12 h-12 rounded-xl bg-brand-50 flex items-center justify-center text-brand-500 mb-4 p-2.5">
                <svg class="w-full h-full" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="24" r="9" class="stroke-brand-500" />
                    <circle cx="30" cy="24" r="9" class="stroke-brand-600" />
                    <path d="M18 28c3 4 9 4 12 0" class="stroke-brand-500" stroke-width="2.5" />
                </svg>
            </div>

            <div class="space-y-1.5 mb-7">
                <h1 class="font-black text-2xl sm:text-3xl text-ui-title tracking-tight flex items-baseline justify-center gap-2">
                    <span>揪行</span>
                    <span class="font-mono text-xl sm:text-2xl font-black text-brand-500 tracking-normal">JooGO</span>
                </h1>
                <p class="text-xs text-ui-subtitle font-medium tracking-wide">把一句想去，變成一起出發</p>
            </div>

            <button id="btn-google-login" type="button" style="touch-action: manipulation;" class="w-full h-[50px] px-5 bg-white hover:bg-slate-50 active:bg-slate-100 active:scale-[0.98] border border-slate-200 rounded-xl flex items-center justify-center gap-3 transition-all duration-150 shadow-xs cursor-pointer">
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span class="text-sm font-bold text-slate-700 tracking-tight" id="login-text">使用 Google 帳號快速登入</span>
            </button>

            <p class="text-[11px] text-slate-400 mt-5 leading-relaxed">
                登入即代表您同意揪行之服務條款。<br>系統將直接同步您的 Google 個人暱稱與頭貼。
            </p>
        </div>
    </main>

    <footer class="shrink-0 w-full pb-6 text-center text-[11px] text-slate-400 font-mono">
        &copy; JooGO. All rights reserved.
    </footer>

    <script type="module">
      import { loginWithGoogle, onAuthStateChange } from "./js/api/authApi.js";
    
      const btnLogin = document.getElementById('btn-google-login');
      const loginText = document.getElementById('login-text');
    
      // 1. 已登入狀態自動轉址
      onAuthStateChange((user) => {
        if (user) {
          console.log("【驗證】偵測到已登入狀態，跳轉至 index.html");
          window.location.replace("index.html");
        }
      });
    
      // 2. 登入按鈕事件綁定
      if (btnLogin) {
        btnLogin.addEventListener('click', async (e) => {
          e.preventDefault();
          console.log("【點擊】已觸發 Google 登入按鈕");
    
          try {
            btnLogin.disabled = true;
            btnLogin.classList.add('opacity-75', 'cursor-wait');
            if (loginText) loginText.innerText = "驗證中，請稍候...";
    
            await loginWithGoogle();
            window.location.replace("index.html");
          } catch (err) {
            console.error("【登入錯誤詳情】", err);
    
            // 常見錯誤友善提示
            if (err.code === "auth/popup-closed-by-user") {
              console.warn("使用者自行關閉了登入視窗");
            } else if (err.code === "auth/unauthorized-domain") {
              alert("登入失敗：目前網域尚未加入 Firebase 授權清單（Authorized domains）。");
            } else {
              alert("登入失敗：" + (err.message || "請檢查網路或稍後再試"));
            }
    
            btnLogin.disabled = false;
            btnLogin.classList.remove('opacity-75', 'cursor-wait');
            if (loginText) loginText.innerText = "使用 Google 帳號快速登入";
          }
        });
      } else {
        console.error("找不到 #btn-google-login 按鈕節點");
      }
    
      window.addEventListener('DOMContentLoaded', () => {
        if (window.lucide) lucide.createIcons();
      });
    </script>
</body>
</html>
