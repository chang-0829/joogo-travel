<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-[#f8fafc]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>登入 - 揪行 JooGO</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7', // 品牌主色
                            600: '#0369a1', // 主色(深)
                            700: '#075985',
                        },
                        ui: {
                            bg: '#f8fafc',
                            title: '#0f172a',
                            subtitle: '#64748b',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between bg-[#f8fafc] text-ui-title antialiased selection:bg-brand-500 selection:text-white">

    <!-- 頂部防呆留白（適配 iOS 動態島 / 瀏海安全區） -->
    <div class="h-6 w-full"></div>

    <!-- 主內容核心區塊 -->
    <main class="w-full max-w-sm mx-auto px-6 py-4 flex flex-col items-center">
        
        <!-- 品牌視覺卡片 -->
        <div class="w-full bg-white rounded-[28px] p-8 sm:p-9 shadow-sm border border-slate-200/70 flex flex-col items-center text-center">
            
            <!-- 品牌圖標 (款式三雙 oo 微笑同心環概念) -->
            <div class="w-16 h-16 rounded-2xl bg-brand-100 flex items-center justify-center text-brand-500 mb-5 shadow-xs">
                <svg class="w-10 h-10" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                    <!-- 左環 -->
                    <circle cx="18" cy="24" r="9" class="stroke-brand-500" />
                    <!-- 右環交疊 -->
                    <circle cx="30" cy="24" r="9" class="stroke-brand-600" />
                    <!-- 微笑連結弧線 -->
                    <path d="M18 28c3 4 9 4 12 0" class="stroke-brand-500" stroke-width="2.5" />
                </svg>
            </div>

            <!-- 品牌名稱與 Slogan -->
            <div class="space-y-1.5 mb-8">
                <h1 class="font-bold text-2xl text-ui-title tracking-tight flex items-center justify-center gap-1.5">
                    <span>揪行</span>
                    <span class="text-sm font-mono font-extrabold text-brand-500 tracking-wider">JooGO</span>
                </h1>
                <p class="text-xs text-ui-subtitle tracking-wide">把一句想去，變成一起出發</p>
            </div>

            <!-- iOS 觸控規範 Google 登入按鈕 (高度 50px > 44pt，點擊更舒適) -->
            <button id="btn-google-login" type="button" class="w-full h-[50px] px-5 bg-white hover:bg-slate-50 active:bg-slate-100 active:scale-[0.98] border border-slate-200 rounded-2xl flex items-center justify-center gap-3 transition-all duration-150 shadow-xs cursor-pointer">
                <!-- 原生 Google 4 色 Logo -->
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span class="text-sm font-bold text-slate-700 tracking-tight" id="login-text">使用 Google 帳號快速登入</span>
            </button>

            <!-- 隱私與服務提示 -->
            <p class="text-[11px] text-slate-400 mt-6 leading-relaxed">
                登入即代表您同意揪行之服務條款。<br>系統將直接同步您的頭貼與暱稱。
            </p>
        </div>

    </main>

    <!-- 底部版權與環境適配（避開 iOS Home Bar） -->
    <footer class="w-full pb-6 text-center text-[11px] text-slate-400 font-mono">
        &copy; JooGO. All rights reserved.
    </footer>

    <!-- 模組化邏輯 -->
    <script type="module">
        import { loginWithGoogle, subscribeAuthState } from "./js/api/authApi.js";

        const btnLogin = document.getElementById('btn-google-login');
        const loginText = document.getElementById('login-text');

        // 若已登入狀態，自動跳轉回首頁列表
        subscribeAuthState((user) => {
            if (user) {
                window.location.href = "index.html";
            }
        });

        // 監聽點擊 Google 登入
        btnLogin.addEventListener('click', async () => {
            try {
                btnLogin.disabled = true;
                btnLogin.classList.add('opacity-75', 'cursor-wait');
                loginText.innerText = "驗證中，請稍候...";

                await loginWithGoogle();
                // 成功後 subscribeAuthState 會自動導向 index.html
            } catch (err) {
                alert("Google 登入失敗: " + err.message);
                btnLogin.disabled = false;
                btnLogin.classList.remove('opacity-75', 'cursor-wait');
                loginText.innerText = "使用 Google 帳號快速登入";
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>
</html>
