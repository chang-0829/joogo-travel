<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-[#f8fafc] overscroll-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>揪行 JooGO 後台管理</title>
    
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        /* 防止 iOS Safari 聚焦放大 */
        input, select, textarea {
            font-size: 16px !important;
            outline: none !important;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #0284c7 !important;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-full flex flex-col font-sans text-slate-800 antialiased bg-[#f8fafc]">

    <!-- ==================== 頂部導覽列 ==================== -->
    <header class="sticky top-0 z-30 bg-[#f8fafc]/90 backdrop-blur-md pt-[env(safe-area-inset-top)]">
        <div class="max-w-4xl mx-auto px-5 sm:px-6 h-16 flex items-center justify-between">
            
            <div class="flex items-center gap-2.5">
                <span class="font-extrabold text-lg sm:text-xl tracking-tight text-slate-900 flex items-center gap-1.5">
                    <span>揪行</span>
                    <span class="font-mono text-brand-600">JooGO</span>
                </span>
                <span class="px-2.5 py-0.5 text-xs font-bold bg-sky-50 text-sky-600 border border-sky-200/70 rounded-lg">
                    後台管理
                </span>
            </div>

            <!-- 桌面端切換選單 -->
            <div class="hidden md:flex items-center gap-5">
                <div class="flex items-center bg-slate-200/70 p-1 rounded-xl">
                    <button onclick="switchView('country-list')" id="desk-tab-countries" class="tab-btn px-4 py-1.5 text-xs font-bold rounded-lg transition-all bg-white text-slate-900 shadow-xs flex items-center gap-1.5">
                        <i data-lucide="globe" class="w-4 h-4 text-brand-600"></i>
                        <span>管理國家/地區</span>
                    </button>
                    <button onclick="switchView('airlines')" id="desk-tab-airlines" class="tab-btn px-4 py-1.5 text-xs font-semibold rounded-lg transition-all text-slate-600 hover:text-slate-900 flex items-center gap-1.5">
                        <i data-lucide="plane" class="w-4 h-4 text-sky-600"></i>
                        <span>航空公司行李庫</span>
                    </button>
                </div>
                <a href="index.html" class="flex items-center gap-1 text-xs font-bold text-slate-500 hover:text-brand-600 transition-colors">
                    <span>回到前台</span>
                    <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                </a>
            </div>

            <!-- 手機端漢堡按鈕 (44pt 熱區) -->
            <div class="flex md:hidden items-center">
                <button id="btn-hamburger" type="button" aria-label="選單" class="w-11 h-11 flex items-center justify-center text-slate-600 hover:text-slate-900 active:scale-95 rounded-xl border border-slate-200/80 bg-white/60 transition-all">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- ==================== 漢堡側邊抽屜 ==================== -->
    <div id="drawer-backdrop" class="fixed inset-0 z-40 bg-slate-950/40 backdrop-blur-xs hidden opacity-0 transition-opacity duration-300"></div>
    <aside id="drawer-menu" class="fixed top-0 right-0 bottom-0 z-50 w-72 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col justify-between">
        <div class="p-6 space-y-6">
            <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                <div class="flex items-center gap-2">
                    <span class="font-bold text-base text-slate-900">揪行 JooGO</span>
                    <span class="px-2 py-0.5 text-[11px] font-bold bg-sky-50 text-sky-600 rounded-md">管理</span>
                </div>
                <button id="btn-close-drawer" class="w-11 h-11 flex items-center justify-center text-slate-400 hover:text-slate-700 active:scale-90 rounded-xl hover:bg-slate-100">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="space-y-1.5">
                <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-2 mb-2">資料庫選單</p>
                <button onclick="switchView('country-list'); closeDrawer();" class="w-full flex items-center justify-between px-3.5 py-3 rounded-2xl text-xs font-bold bg-brand-50 text-brand-600 transition-all">
                    <div class="flex items-center gap-2.5">
                        <i data-lucide="globe" class="w-4 h-4"></i>
                        <span>管理國家/地區</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 opacity-70"></i>
                </button>

                <button onclick="switchView('airlines'); closeDrawer();" class="w-full flex items-center justify-between px-3.5 py-3 rounded-2xl text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-all">
                    <div class="flex items-center gap-2.5">
                        <i data-lucide="plane" class="w-4 h-4 text-sky-600"></i>
                        <span>航空公司行李庫</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 opacity-70"></i>
                </button>
            </div>
        </div>

        <div class="p-6 border-t border-slate-100">
            <a href="index.html" class="w-full h-11 bg-slate-100 hover:bg-slate-200 active:scale-98 rounded-xl flex items-center justify-center gap-2 text-xs font-bold text-slate-700 transition-all">
                <i data-lucide="external-link" class="w-4 h-4"></i>
                <span>返回前台列表</span>
            </a>
        </div>
    </aside>

    <!-- ==================== 主管理區 ==================== -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-5 sm:px-6 py-5 space-y-6 overflow-y-auto">

        <!-- ==================== VIEW 1: 國家列表視圖 ==================== -->
        <section id="view-country-list" class="space-y-5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <h2 class="text-2xl font-bold text-slate-900 tracking-tight">管理國家/地區</h2>
                
                <div class="flex items-center gap-3">
                    <div class="relative w-full sm:w-64">
                        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                        <input type="text" id="country-search-input" placeholder="搜尋國家或地區..." class="w-full h-11 pl-10 pr-4 bg-white border border-slate-200/80 rounded-2xl font-medium text-slate-800 placeholder:text-slate-400 focus:border-brand-500 transition-all shadow-xs">
                    </div>

                    <button id="btn-add-country-modal" class="h-11 px-4 flex items-center justify-center gap-1.5 text-xs font-bold text-white bg-brand-500 hover:bg-brand-600 active:scale-95 rounded-2xl transition-all shadow-xs shrink-0 cursor-pointer">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>新增</span>
                    </button>
                </div>
            </div>

            <div id="countries-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
        </section>

        <!-- ==================== VIEW 2: 國家專屬細部設定 (iOS Grouped List 原生分組風格) ==================== -->
        <section id="view-country-detail" class="hidden space-y-6 pb-12">
            <!-- 頂部導覽列 -->
            <div class="flex items-center justify-between gap-4">
                <div class="flex items-center gap-2">
                    <button onclick="switchView('country-list')" class="w-11 h-11 -ml-2 flex items-center justify-center text-brand-600 hover:text-brand-700 active:scale-95 transition-all">
                        <i data-lucide="chevron-left" class="w-6 h-6"></i>
                    </button>
                    <h2 class="text-2xl font-bold text-slate-900 tracking-tight">管理國家/地區</h2>
                </div>
                
                <button id="btn-save-country-detail" onclick="saveCurrentCountryDetail()" class="h-11 px-5 text-xs font-bold text-white bg-brand-500 hover:bg-brand-600 active:scale-95 rounded-2xl transition-all shadow-xs flex items-center gap-1.5 cursor-pointer shrink-0">
                    <i data-lucide="check" class="w-4 h-4"></i>
                    <span>儲存</span>
                </button>
            </div>

            <!-- 當前國家名稱 -->
            <div class="px-1 pt-1">
                <h3 class="text-xl font-extrabold text-slate-900 tracking-tight" id="detail-country-name">-</h3>
            </div>

            <!-- 分組 1：基本設定 (含 Cloudinary 圖片上傳與即時縮圖預覽) -->
            <div class="space-y-2">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-3">基本設定</div>
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs divide-y divide-slate-100 overflow-hidden">
                    <div class="p-3.5 px-4 flex items-center justify-between">
                        <span class="text-sm font-bold text-slate-800">通用幣別</span>
                        <input type="text" id="detail-base-currency" class="text-right font-mono font-bold text-slate-700 uppercase bg-transparent border-none w-36 p-0">
                    </div>
                    <div class="p-3.5 px-4 flex items-center justify-between">
                        <span class="text-sm font-bold text-slate-800">時區 (UTC)</span>
                        <input type="text" id="detail-base-timezone" class="text-right font-mono font-bold text-slate-700 bg-transparent border-none w-36 p-0">
                    </div>
                    <!-- 包含地區標籤 -->
                    <div class="p-4 space-y-2">
                        <span class="text-sm font-bold text-slate-800 block">包含地區標籤</span>
                        <div class="min-h-[44px] p-2 border border-slate-200/80 rounded-xl flex flex-wrap items-center gap-1.5 bg-slate-50/50">
                            <div id="detail-tag-badge-list" class="flex flex-wrap gap-1.5"></div>
                            <input type="text" id="detail-region-tag-input" placeholder="輸入後按 Enter 新增" class="flex-1 min-w-[140px] border-none bg-transparent p-1 text-xs">
                        </div>
                    </div>

                    <!-- 預設封面圖：Cloudinary 點擊上傳 + 本機即時預覽 -->
                    <div class="p-4 space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-sm font-bold text-slate-800">封面圖片庫</span>
                            <span class="text-xs text-slate-400 font-mono" id="cover-count-label">共 0 張</span>
                        </div>

                        <!-- 檔案選擇按鈕 (相容手機相簿與電腦拖曳) -->
                        <label class="border-2 border-dashed border-slate-200 hover:border-brand-500 bg-slate-50/60 hover:bg-brand-50/30 rounded-2xl p-4 flex flex-col items-center justify-center gap-1.5 cursor-pointer transition-all active:scale-[0.99]">
                            <div class="w-10 h-10 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center">
                                <i data-lucide="image-plus" class="w-5 h-5"></i>
                            </div>
                            <span class="text-xs font-bold text-slate-700">點擊選取或拍照上傳封面圖</span>
                            <span class="text-[11px] text-slate-400">支援多張上傳，系統將自動同步儲存至雲端</span>
                            <input type="file" id="cover-file-input" accept="image/*" multiple class="hidden">
                        </label>

                        <!-- 即時縮圖網格展示 -->
                        <div id="cover-thumbnails-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-2.5 pt-1"></div>
                    </div>
                </div>
            </div>

            <!-- 分組 2：行前須知公版 -->
            <div class="space-y-2">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-3">公版行前須知</div>
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs divide-y divide-slate-100 overflow-hidden">
                    <div class="p-4 space-y-1.5">
                        <label class="text-sm font-bold text-slate-800 block">電壓與插座規格</label>
                        <input type="text" id="detail-notice-voltage" class="w-full p-2.5 bg-slate-50/50 border border-slate-200/80 rounded-xl text-xs">
                    </div>
                    <div class="p-4 space-y-1.5">
                        <label class="text-sm font-bold text-slate-800 block">簽證 / 入境申報規範</label>
                        <input type="text" id="detail-notice-visa" class="w-full p-2.5 bg-slate-50/50 border border-slate-200/80 rounded-xl text-xs">
                    </div>
                    <div class="p-4 space-y-1.5">
                        <label class="text-sm font-bold text-slate-800 block">交通與支付指南</label>
                        <textarea id="detail-notice-traffic" rows="2" class="w-full p-2.5 bg-slate-50/50 border border-slate-200/80 rounded-xl text-xs"></textarea>
                    </div>
                    <div class="p-4 space-y-1.5">
                        <label class="text-sm font-bold text-slate-800 block">退稅與其他注意事項</label>
                        <textarea id="detail-notice-tax" rows="2" class="w-full p-2.5 bg-slate-50/50 border border-slate-200/80 rounded-xl text-xs"></textarea>
                    </div>
                </div>
            </div>

            <!-- 分組 3：急難救助專線 -->
            <div class="space-y-2">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-3">急難救助資訊</div>
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs divide-y divide-slate-100 overflow-hidden">
                    <div class="p-3.5 px-4 flex items-center justify-between">
                        <span class="text-sm font-bold text-slate-800">當地報警電話</span>
                        <input type="tel" id="detail-emg-police" class="text-right font-mono font-bold text-slate-700 bg-transparent border-none w-32 p-0">
                    </div>
                    <div class="p-3.5 px-4 flex items-center justify-between">
                        <span class="text-sm font-bold text-slate-800">當地救護車專線</span>
                        <input type="tel" id="detail-emg-ambulance" class="text-right font-mono font-bold text-slate-700 bg-transparent border-none w-32 p-0">
                    </div>
                    <div class="p-4 space-y-1.5">
                        <label class="text-sm font-bold text-slate-800 block">台灣駐外館處 / 急難救助電話</label>
                        <input type="text" id="detail-emg-embassy" class="w-full p-2.5 bg-slate-50/50 border border-slate-200/80 rounded-xl text-xs font-medium">
                    </div>
                    <div class="p-4 space-y-1.5">
                        <label class="text-sm font-bold text-slate-800 block">求助專線備註說明</label>
                        <textarea id="detail-emg-memo" rows="2" class="w-full p-2.5 bg-slate-50/50 border border-slate-200/80 rounded-xl text-xs"></textarea>
                    </div>
                </div>
            </div>

            <!-- 分組 4：公版優惠券 -->
            <div class="space-y-2">
                <div class="flex items-center justify-between px-3">
                    <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">公版優惠券 (<span id="coupon-count">0</span>)</div>
                    <button onclick="openAddCouponModal()" class="text-xs font-bold text-brand-600 hover:text-brand-700 flex items-center gap-1 cursor-pointer">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        <span>新增優惠券</span>
                    </button>
                </div>

                <div id="coupons-grid" class="space-y-3"></div>
            </div>
        </section>

        <!-- ==================== VIEW 3: 航司行李庫 ==================== -->
        <section id="view-airlines" class="hidden space-y-4">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-xl font-bold text-slate-900">航空公司行李規範庫</h2>
                    <p class="text-xs text-slate-400 mt-0.5">主揪設定航班時可一鍵套用[span_2](start_span)[span_2](end_span)。</p>
                </div>
                <button id="btn-add-airline" class="h-11 px-4 flex items-center justify-center gap-2 text-xs font-bold text-white bg-sky-600 hover:bg-sky-700 active:scale-95 rounded-2xl transition-all shadow-xs cursor-pointer">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>新增航司</span>
                </button>
            </div>
            <div id="airlines-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </section>
    </main>

    <!-- ==================== 彈窗：新增國家/地區 ==================== -->
    <div id="modal-country" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="text-base font-bold text-slate-900">新增國家/地區</h3>
                <button type="button" id="btn-close-country-modal" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-100"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <form id="form-country-create" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">國家 / 地區名稱</label>
                    <input type="text" id="create-country-name" required placeholder="日本、韓國、泰國" class="w-full h-11 px-3.5 border border-slate-200 rounded-2xl font-bold text-slate-900">
                </div>

                <div class="flex justify-end gap-2.5 pt-2 border-t border-slate-100">
                    <button type="button" id="btn-cancel-country-modal" class="w-1/2 h-11 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-2xl">取消</button>
                    <button type="submit" class="w-1/2 h-11 text-xs font-bold text-white bg-brand-500 hover:bg-brand-600 active:scale-95 rounded-2xl transition-all">建立並前往設定</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ==================== 彈窗：新增優惠券 ==================== -->
    <div id="modal-coupon" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="text-base font-bold text-slate-900" id="modal-coupon-title">新增公版優惠券</h3>
                <button type="button" id="btn-close-coupon-modal" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-100"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="form-coupon" class="space-y-3.5">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">商戶 / 店名</label>
                    <input type="text" id="coupon-store" required placeholder="例如：Bic Camera, 唐吉訶德" class="w-full h-11 px-3.5 border border-slate-200 rounded-2xl font-bold">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">優惠簡稱</label>
                    <input type="text" id="coupon-discount" required placeholder="免稅 10% + 最高 7% 折扣" class="w-full h-11 px-3.5 border border-slate-200 rounded-2xl font-semibold text-amber-600">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">優惠代碼</label>
                        <input type="text" id="coupon-code" placeholder="JOOGO2026" class="w-full h-11 px-3.5 border border-slate-200 rounded-2xl font-mono uppercase">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">有效期限</label>
                        <input type="text" id="coupon-expiry" placeholder="長期有效" class="w-full h-11 px-3.5 border border-slate-200 rounded-2xl">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">條碼圖片 / 領取連結</label>
                    <input type="url" id="coupon-link" placeholder="https://..." class="w-full h-11 px-3.5 border border-slate-200 rounded-2xl font-mono" autocorrect="off" autocapitalize="none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">使用限制說明</label>
                    <input type="text" id="coupon-notes" placeholder="結帳前出示條碼，菸酒不適用" class="w-full h-11 px-3.5 border border-slate-200 rounded-2xl">
                </div>
                <div class="flex justify-end gap-2.5 pt-3 border-t border-slate-100">
                    <button type="button" id="btn-cancel-coupon" class="w-1/2 h-11 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-2xl">取消</button>
                    <button type="submit" class="w-1/2 h-11 text-xs font-bold text-white bg-amber-600 hover:bg-amber-700 active:scale-95 rounded-2xl transition-all">儲存優惠券</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast-message" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden bg-slate-900/90 text-white text-xs px-4 py-2.5 rounded-full shadow-xl backdrop-blur-md transition-all flex items-center gap-2">
        <i data-lucide="info" class="w-4 h-4 text-brand-400"></i>
        <span id="toast-text">提示訊息</span>
    </div>

    <!-- ==================== JS 模組控制 ==================== -->
    <script type="module">
        import { db } from "./js/config/firebase.js";
        import { 
            collection, doc, onSnapshot, getDoc, setDoc, deleteDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { uploadToCloudinary } from "./js/api/uploadApi.js";

        let currentCountries = [];
        let activeCountryId = null;
        let activeCountryData = null;
        let detailRegionTags = [];
        let currentCovers = []; // 當前國家封面圖片 URL 陣列
        let searchQuery = "";

        function showToast(msg) {
            const toast = document.getElementById('toast-message');
            const toastText = document.getElementById('toast-text');
            if (toast && toastText) {
                toastText.innerText = msg;
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.add('hidden'), 2200);
            }
        }

        // ==================== 抽屜選單 ====================
        const drawer = document.getElementById('drawer-menu');
        const backdrop = document.getElementById('drawer-backdrop');

        function openDrawer() {
            backdrop.classList.remove('hidden');
            setTimeout(() => backdrop.classList.remove('opacity-0'), 10);
            drawer.classList.remove('translate-x-full');
            document.body.style.overflow = 'hidden';
        }

        window.closeDrawer = function() {
            backdrop.classList.add('opacity-0');
            drawer.classList.add('translate-x-full');
            setTimeout(() => backdrop.classList.add('hidden'), 300);
            document.body.style.overflow = '';
        };

        document.getElementById('btn-hamburger').addEventListener('click', openDrawer);
        document.getElementById('btn-close-drawer').addEventListener('click', window.closeDrawer);
        backdrop.addEventListener('click', window.closeDrawer);

        // ==================== 地區標籤交互 ====================
        const detailRegionInput = document.getElementById('detail-region-tag-input');
        const detailBadgeList = document.getElementById('detail-tag-badge-list');

        function renderDetailRegionTags() {
            detailBadgeList.innerHTML = detailRegionTags.map((tag, idx) => `
                <span class="inline-flex items-center gap-1 pl-2.5 pr-1 py-1 bg-white border border-slate-200 text-slate-800 text-xs font-semibold rounded-lg shadow-2xs">
                    <span>${tag}</span>
                    <button type="button" onclick="window.removeDetailRegionTag(${idx})" class="w-6 h-6 flex items-center justify-center text-slate-400 hover:text-rose-600 focus:outline-none">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                </span>
            `).join('');
            if (window.lucide) lucide.createIcons();
        }

        window.removeDetailRegionTag = function(idx) {
            detailRegionTags.splice(idx, 1);
            renderDetailRegionTags();
        };

        detailRegionInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const val = detailRegionInput.value.trim();
                if (val && !detailRegionTags.includes(val)) {
                    detailRegionTags.push(val);
                    renderDetailRegionTags();
                    detailRegionInput.value = '';
                }
            }
        });

        // ==================== 封面圖 Cloudinary 上傳與即時預覽 ====================
        function renderCoverThumbnails() {
            const container = document.getElementById('cover-thumbnails-grid');
            const countLabel = document.getElementById('cover-count-label');
            countLabel.innerText = `共 ${currentCovers.length} 張`;

            if (currentCovers.length === 0) {
                container.innerHTML = `<div class="col-span-full py-4 text-center text-xs text-slate-300">尚未上傳封面圖片</div>`;
                return;
            }

            container.innerHTML = currentCovers.map((imgUrl, idx) => `
                <div class="relative group rounded-xl overflow-hidden aspect-video bg-slate-100 border border-slate-200/80 shadow-2xs">
                    <img src="${imgUrl}" class="w-full h-full object-cover">
                    <!-- 刪除照片按鈕 -->
                    <button type="button" onclick="window.removeCoverImage(${idx})" class="w-7 h-7 bg-slate-900/75 hover:bg-rose-600 text-white rounded-full flex items-center justify-center absolute top-1 right-1 shadow-md transition-all active:scale-90">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            `).join('');

            if (window.lucide) lucide.createIcons();
        }

        window.removeCoverImage = function(idx) {
            currentCovers.splice(idx, 1);
            renderCoverThumbnails();
        };

        // 監聽選檔上傳
        const coverFileInput = document.getElementById('cover-file-input');
        coverFileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            showToast(`正在上傳 ${files.length} 張照片至 Cloudinary...`);
            
            for (const file of files) {
                try {
                    // 本機即時預覽（先畫出來不用等）
                    const tempLocalUrl = URL.createObjectURL(file);
                    
                    // 背景直傳 Cloudinary
                    const cloudUrl = await uploadToCloudinary(file);
                    currentCovers.push(cloudUrl);
                    renderCoverThumbnails();
                } catch (err) {
                    console.error("上傳失敗", err);
                    showToast("圖片上傳失敗：" + err.message);
                }
            }

            // 清除 input 避免選取同一檔案無反應
            coverFileInput.value = "";
            showToast("圖片上傳完成！");
        });

        // ==================== 頁面視圖切換 ====================
        window.switchView = function(viewName) {
            const isCountryList = viewName === 'country-list';
            const isCountryDetail = viewName === 'country-detail';
            const isAirlines = viewName === 'airlines';

            document.getElementById('view-country-list').classList.toggle('hidden', !isCountryList);
            document.getElementById('view-country-detail').classList.toggle('hidden', !isCountryDetail);
            document.getElementById('view-airlines').classList.toggle('hidden', !isAirlines);

            const deskCountry = document.getElementById('desk-tab-countries');
            const deskAir = document.getElementById('desk-tab-airlines');
            if (isAirlines) {
                deskAir.className = "tab-btn px-4 py-1.5 text-xs font-bold rounded-lg transition-all bg-white text-slate-900 shadow-xs flex items-center gap-1.5";
                deskCountry.className = "tab-btn px-4 py-1.5 text-xs font-semibold rounded-lg transition-all text-slate-600 hover:text-slate-900 flex items-center gap-1.5";
            } else {
                deskCountry.className = "tab-btn px-4 py-1.5 text-xs font-bold rounded-lg transition-all bg-white text-slate-900 shadow-xs flex items-center gap-1.5";
                deskAir.className = "tab-btn px-4 py-1.5 text-xs font-semibold rounded-lg transition-all text-slate-600 hover:text-slate-900 flex items-center gap-1.5";
            }
        };

        // ==================== 搜尋框監聽 ====================
        const searchInput = document.getElementById('country-search-input');
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim().toLowerCase();
            renderCountries();
        });

        // ==================== 渲染國家卡片列表 ====================
        function renderCountries() {
            const grid = document.getElementById('countries-grid');
            
            const filtered = currentCountries.filter(c => {
                if (!searchQuery) return true;
                const matchName = c.id.toLowerCase().includes(searchQuery);
                const matchRegions = (c.regions || []).some(r => r.toLowerCase().includes(searchQuery));
                return matchName || matchRegions;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-16 text-center text-xs text-slate-400">找不到符合條件的國家或地區</div>`;
                return;
            }

            grid.innerHTML = filtered.map(c => {
                const cover = (c.coverImages && c.coverImages.length > 0) ? c.coverImages[0] : 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&q=80&w=600';
                return `
                <div class="bg-white rounded-3xl border border-slate-200/80 shadow-xs hover:shadow-md transition-all overflow-hidden flex flex-col justify-between">
                    <div>
                        <div class="relative h-36 w-full bg-slate-100 overflow-hidden">
                            <img src="${cover}" class="w-full h-full object-cover">
                        </div>
                    </div>

                    <div class="p-4 flex items-center justify-between">
                        <div>
                            <h3 class="font-bold text-base text-slate-900 tracking-tight">${c.id}</h3>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="window.openCountryDetail('${c.id}')" title="編輯國家與公版資料" class="w-11 h-11 flex items-center justify-center text-slate-400 hover:text-brand-600 rounded-xl hover:bg-slate-50 transition-colors">
                                <i data-lucide="pencil" class="w-4 h-4"></i>
                            </button>
                            <button onclick="window.deleteCountry('${c.id}')" title="刪除國家" class="w-11 h-11 flex items-center justify-center text-slate-400 hover:text-rose-600 rounded-xl hover:bg-slate-50 transition-colors">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');

            if (window.lucide) lucide.createIcons();
        }

        // ==================== 即時監聽國家列表 ====================
        function initCountriesListener() {
            onSnapshot(collection(db, "templates", "countries", "items"), (snapshot) => {
                currentCountries = [];
                snapshot.forEach(docSnap => {
                    currentCountries.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderCountries();

                if (activeCountryId) {
                    const found = currentCountries.find(x => x.id === activeCountryId);
                    if (found) {
                        activeCountryData = found;
                    }
                }
            }, (error) => {
                showToast("即時監聽失敗：" + error.message);
            });
        }

        // ==================== 國家詳情整合設定 ====================
        window.openCountryDetail = async function(countryId) {
            activeCountryId = countryId;
            const docRef = doc(db, "templates", "countries", "items", countryId);
            const docSnap = await getDoc(docRef);
            if (!docSnap.exists()) return;
            activeCountryData = docSnap.data();

            document.getElementById('detail-country-name').innerText = countryId;

            // 回填基本資料
            document.getElementById('detail-base-currency').value = activeCountryData.currency || '';
            document.getElementById('detail-base-timezone').value = activeCountryData.timezone || '';
            
            // 回填 Cloudinary 封面圖清單並渲染縮圖
            currentCovers = [...(activeCountryData.coverImages || [])];
            renderCoverThumbnails();

            // 回填地區標籤
            detailRegionTags = [...(activeCountryData.regions || [])];
            renderDetailRegionTags();

            // 回填行前須知
            const n = activeCountryData.notice || {};
            document.getElementById('detail-notice-voltage').value = n.voltage || '';
            document.getElementById('detail-notice-visa').value = n.visa || '';
            document.getElementById('detail-notice-traffic').value = n.traffic || '';
            document.getElementById('detail-notice-tax').value = n.tax || '';

            // 回填急難救助
            const emg = activeCountryData.emergency || {};
            document.getElementById('detail-emg-police').value = emg.police || activeCountryData.police || '';
            document.getElementById('detail-emg-ambulance').value = emg.ambulance || activeCountryData.ambulance || '';
            document.getElementById('detail-emg-embassy').value = emg.embassy || activeCountryData.foreignEmergency || '';
            document.getElementById('detail-emg-memo').value = emg.memo || activeCountryData.memo || '';

            renderCoupons();
            switchView('country-detail');
        };

        // 儲存變更
        window.saveCurrentCountryDetail = async function() {
            if (!activeCountryId) return;

            const saveBtn = document.getElementById('btn-save-country-detail');
            saveBtn.disabled = true;
            saveBtn.innerHTML = `<span>儲存中...</span>`;

            try {
                const leftover = detailRegionInput.value.trim();
                if (leftover && !detailRegionTags.includes(leftover)) {
                    detailRegionTags.push(leftover);
                    detailRegionInput.value = '';
                    renderDetailRegionTags();
                }

                const updated = {
                    currency: document.getElementById('detail-base-currency').value.trim().toUpperCase(),
                    timezone: document.getElementById('detail-base-timezone').value.trim(),
                    regions: detailRegionTags,
                    coverImages: currentCovers, // 儲存 Cloudinary URL 陣列
                    notice: {
                        voltage: document.getElementById('detail-notice-voltage').value.trim(),
                        visa: document.getElementById('detail-notice-visa').value.trim(),
                        traffic: document.getElementById('detail-notice-traffic').value.trim(),
                        tax: document.getElementById('detail-notice-tax').value.trim()
                    },
                    emergency: {
                        police: document.getElementById('detail-emg-police').value.trim(),
                        ambulance: document.getElementById('detail-emg-ambulance').value.trim(),
                        embassy: document.getElementById('detail-emg-embassy').value.trim(),
                        memo: document.getElementById('detail-emg-memo').value.trim()
                    },
                    police: document.getElementById('detail-emg-police').value.trim(),
                    ambulance: document.getElementById('detail-emg-ambulance').value.trim(),
                    foreignEmergency: document.getElementById('detail-emg-embassy').value.trim(),
                    memo: document.getElementById('detail-emg-memo').value.trim()
                };

                await setDoc(doc(db, "templates", "countries", "items", activeCountryId), updated, { merge: true });
                showToast(`已儲存「${activeCountryId}」所有資料！`);
            } catch (err) {
                showToast("儲存失敗：" + err.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i><span>儲存</span>`;
                if (window.lucide) lucide.createIcons();
            }
        };

        // ==================== 優惠券清單渲染 ====================
        function renderCoupons() {
            const coupons = (activeCountryData && activeCountryData.coupons) ? activeCountryData.coupons : [];
            document.getElementById('coupon-count').innerText = coupons.length;
            const grid = document.getElementById('coupons-grid');

            if (coupons.length === 0) {
                grid.innerHTML = `<div class="bg-white rounded-2xl border border-slate-200/80 p-6 text-center text-xs text-slate-400">目前尚無優惠券，可點選上方「新增優惠券」按鈕。</div>`;
                return;
            }

            grid.innerHTML = `
            <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs divide-y divide-slate-100 overflow-hidden">
                ${coupons.map((cp, idx) => `
                    <div class="p-4 flex items-center justify-between gap-3">
                        <div class="space-y-0.5 flex-1 min-w-0">
                            <div class="flex items-center gap-2">
                                <span class="text-sm font-bold text-slate-900 truncate">${cp.store}</span>
                                ${cp.code ? `<span class="px-2 py-0.5 text-[10px] font-mono font-bold bg-slate-100 text-slate-600 rounded">${cp.code}</span>` : ''}
                            </div>
                            <div class="text-xs font-bold text-amber-600">${cp.discount}</div>
                            ${cp.expiry ? `<div class="text-[11px] text-slate-400">有效期限：${cp.expiry}</div>` : ''}
                            ${cp.link ? `<a href="${cp.link}" target="_blank" class="text-[11px] text-brand-600 hover:underline inline-block mt-0.5 truncate max-w-xs">條碼或兌換連結 ↗</a>` : ''}
                        </div>
                        <button onclick="window.removeCoupon(${idx})" class="w-10 h-10 flex items-center justify-center text-slate-300 hover:text-rose-600 rounded-xl shrink-0 transition-colors">
                            <i data-lucide="trash" class="w-4 h-4"></i>
                        </button>
                    </div>
                `).join('')}
            </div>`;

            if (window.lucide) lucide.createIcons();
        }

        window.openAddCouponModal = () => {
            document.getElementById('form-coupon').reset();
            document.getElementById('modal-coupon').classList.remove('hidden');
        };

        window.removeCoupon = async (index) => {
            if (!confirm("確定刪除此優惠券？")) return;
            const coupons = (activeCountryData && activeCountryData.coupons) ? activeCountryData.coupons : [];
            coupons.splice(index, 1);
            activeCountryData.coupons = coupons;
            await setDoc(doc(db, "templates", "countries", "items", activeCountryId), { coupons }, { merge: true });
            renderCoupons();
            showToast("已刪除優惠券！");
        };

        document.getElementById('form-coupon').onsubmit = async (e) => {
            e.preventDefault();
            const coupons = (activeCountryData && activeCountryData.coupons) ? activeCountryData.coupons : [];
            const newCoupon = {
                store: document.getElementById('coupon-store').value.trim(),
                discount: document.getElementById('coupon-discount').value.trim(),
                code: document.getElementById('coupon-code').value.trim(),
                expiry: document.getElementById('coupon-expiry').value.trim(),
                link: document.getElementById('coupon-link').value.trim(),
                notes: document.getElementById('coupon-notes').value.trim()
            };
            coupons.push(newCoupon);
            activeCountryData.coupons = coupons;
            await setDoc(doc(db, "templates", "countries", "items", activeCountryId), { coupons }, { merge: true });
            document.getElementById('modal-coupon').classList.add('hidden');
            renderCoupons();
            showToast("成功儲存優惠券！");
        };

        document.getElementById('btn-close-coupon-modal').onclick = () => document.getElementById('modal-coupon').classList.add('hidden');
        document.getElementById('btn-cancel-coupon').onclick = () => document.getElementById('modal-coupon').classList.add('hidden');

        // ==================== 刪除國家 ====================
        window.deleteCountry = async (id) => {
            if (confirm(`確定要刪除「${id}」及其所有公版資料嗎？`)) {
                await deleteDoc(doc(db, "templates", "countries", "items", id));
                showToast("已刪除該國家/地區！");
            }
        };

        // ==================== 新增國家/地區 ====================
        document.getElementById('btn-add-country-modal').onclick = () => {
            document.getElementById('form-country-create').reset();
            document.getElementById('modal-country').classList.remove('hidden');
        };

        document.getElementById('btn-close-country-modal').onclick = () => document.getElementById('modal-country').classList.add('hidden');
        document.getElementById('btn-cancel-country-modal').onclick = () => document.getElementById('modal-country').classList.add('hidden');

        document.getElementById('form-country-create').onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('create-country-name').value.trim();

            const initData = {
                currency: "",
                timezone: "",
                regions: [],
                coverImages: []
            };

            await setDoc(doc(db, "templates", "countries", "items", name), initData, { merge: true });
            document.getElementById('modal-country').classList.add('hidden');
            showToast("國家已建立！進入設定");
            window.openCountryDetail(name);
        };

        // ==================== 初始化 ====================
        window.addEventListener('DOMContentLoaded', () => {
            initCountriesListener();
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>
</html>
