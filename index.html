<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-50 overscroll-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>揪行 JooGO - 把一句想去，變成一起出發</title>
    
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        input, select, textarea, button {
            outline: none !important;
            -webkit-tap-highlight-color: transparent !important;
        }
        input:focus, select:focus, textarea:focus {
            box-shadow: none !important;
            border-color: #0284c7 !important;
        }
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            overscroll-behavior-y: none;
            -webkit-overflow-scrolling: touch;
        }
        input, select, textarea { font-size: 16px !important; }
        input[type="date"] {
            -webkit-appearance: none;
            appearance: none;
            min-height: 2.875rem;
            background-color: #ffffff;
            display: flex;
            align-items: center;
        }
        input[type="date"]::-webkit-date-and-time-value {
            text-align: left;
            margin: 0;
            padding: 0;
            height: 1.5rem;
            line-height: 1.5rem;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-full flex flex-col font-sans text-slate-800 antialiased selection:bg-brand-600 selection:text-white bg-slate-50">

    <!-- 頂部導覽列 -->
    <header class="sticky top-0 z-40 bg-slate-50/95 backdrop-blur-md border-b border-slate-200/50 pt-[env(safe-area-inset-top)]">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
            <div>
                <h1 class="font-bold text-xl leading-none text-slate-900 tracking-tight flex items-center gap-1.5">
                    <span>揪行</span>
                    <span class="text-xs font-mono font-extrabold text-brand-600 tracking-wider">JooGO</span>
                </h1>
                <p class="text-[10px] text-slate-400 mt-0.5">把一句想去，變成一起出發</p>
            </div>

            <!-- 右側動作按鈕 -->
            <div class="flex items-center gap-2 sm:gap-3">
                <div class="relative">
                    <button id="add-trip-btn" class="flex items-center gap-1.5 px-3.5 py-2 text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700 active:scale-95 rounded-xl transition-all shadow-xs">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>行程操作</span>
                        <i data-lucide="chevron-down" class="w-3.5 h-3.5 opacity-80"></i>
                    </button>

                    <div id="action-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-2xl shadow-xl border border-slate-100 z-50 py-1.5 overflow-hidden">
                        <button id="btn-open-create" class="w-full flex items-center gap-2.5 px-4 py-2.5 text-xs font-medium text-slate-700 hover:bg-slate-50 text-left transition-colors">
                            <i data-lucide="plus-circle" class="w-4 h-4 text-brand-600"></i>
                            <span>建立新行程</span>
                        </button>
                        <button id="btn-open-join" class="w-full flex items-center gap-2.5 px-4 py-2.5 text-xs font-medium text-slate-700 hover:bg-slate-50 text-left transition-colors border-t border-slate-100">
                            <i data-lucide="key-round" class="w-4 h-4 text-emerald-600"></i>
                            <span>輸入邀請碼加入</span>
                        </button>
                    </div>
                </div>

                <div class="pl-2.5 border-l border-slate-200">
                    <img id="user-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=120" class="w-8 h-8 rounded-full object-cover ring-2 ring-slate-200">
                </div>
            </div>
        </div>
    </header>

    <!-- 凍結標頭區與篩選 Tab -->
    <div class="sticky top-14 z-30 bg-slate-50/95 backdrop-blur-md py-3 border-b border-slate-200/40">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div>
                <h2 class="text-lg font-bold text-slate-900 tracking-tight">你好，<span id="user-display-name">Alex</span></h2>
                <p class="text-slate-500 text-xs mt-0.5">準備好展開下一趟旅程了嗎？以下是你的行程列表。</p>
            </div>

            <!-- 行程分類頁籤 -->
            <div class="flex items-center bg-slate-200/80 p-1 rounded-xl w-full sm:w-fit overflow-x-auto no-scrollbar">
                <button data-filter="all" class="tab-filter-btn flex-1 sm:flex-initial text-center px-3.5 py-1.5 text-xs font-semibold rounded-lg transition-all bg-white text-slate-900 shadow-xs whitespace-nowrap">
                    全部 (<span id="count-all">0</span>)
                </button>
                <button data-filter="active" class="tab-filter-btn flex-1 sm:flex-initial text-center px-3.5 py-1.5 text-xs font-semibold rounded-lg transition-all text-slate-600 whitespace-nowrap">
                    進行中 (<span id="count-active">0</span>)
                </button>
                <button data-filter="upcoming" class="tab-filter-btn flex-1 sm:flex-initial text-center px-3.5 py-1.5 text-xs font-semibold rounded-lg transition-all text-slate-600 whitespace-nowrap">
                    即將到來 (<span id="count-upcoming">0</span>)
                </button>
                <button data-filter="past" class="tab-filter-btn flex-1 sm:flex-initial text-center px-3.5 py-1.5 text-xs font-semibold rounded-lg transition-all text-slate-600 whitespace-nowrap">
                    已結束 (<span id="count-past">0</span>)
                </button>
            </div>
        </div>
    </div>

    <!-- 主要內容區 -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-5 overflow-y-auto">
        <!-- 載入中骨架 -->
        <div id="loading-state" class="flex flex-col items-center justify-center py-20 text-slate-400">
            <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-brand-600 mb-2"></i>
            <span class="text-xs">載入行程中...</span>
        </div>

        <!-- 行程卡片網格 -->
        <div id="trips-grid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 pb-8"></div>

        <!-- 無行程空狀態 -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-center">
            <div class="w-16 h-16 bg-slate-100 rounded-2xl flex items-center justify-center text-slate-400 mb-3">
                <i data-lucide="compass" class="w-8 h-8"></i>
            </div>
            <h3 class="text-base font-bold text-slate-800">尚無行程記錄</h3>
            <p class="text-slate-400 text-xs mt-1">點擊上方按鈕建立新行程，或輸入朋友的邀請碼加入！</p>
        </div>
    </main>

    <!-- Toast 提示 -->
    <div id="toast-message" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden bg-slate-900/90 text-white text-xs px-4 py-2.5 rounded-full shadow-lg backdrop-blur-md transition-all flex items-center gap-2">
        <i data-lucide="info" class="w-4 h-4 text-brand-400"></i>
        <span id="toast-text">提示訊息</span>
    </div>

    <!-- 1. 建立行程 Modal -->
    <div id="create-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-5 sm:p-6 shadow-2xl space-y-4 border border-slate-100">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <div class="flex items-center gap-2.5">
                    <div class="p-2 bg-brand-50 text-brand-600 rounded-xl">
                        <i data-lucide="map-pin" class="w-5 h-5"></i>
                    </div>
                    <h3 class="text-base font-bold text-slate-900">建立新行程</h3>
                </div>
                <button id="close-create-modal" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-full hover:bg-slate-100">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="create-trip-form" class="space-y-3.5">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">行程名稱</label>
                    <input type="text" id="trip-title" required placeholder="例如：2026 東京 7 日賞櫻之旅" class="w-full h-[46px] px-3.5 border border-slate-200 rounded-xl text-base text-slate-800 bg-white">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">旅遊國家 / 地區</label>
                    <select id="trip-country" class="w-full h-[46px] px-3 border border-slate-200 rounded-xl text-base text-slate-800 bg-white">
                        <option value="日本" selected>日本</option>
                        <option value="韓國">韓國</option>
                        <option value="台灣">台灣</option>
                        <option value="泰國">泰國</option>
                        <option value="歐洲地區">歐洲地區</option>
                        <option value="其他">其他地區</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">開始日期</label>
                        <input type="date" id="trip-start" required class="w-full h-[46px] px-3 border border-slate-200 rounded-xl text-base text-slate-800 bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">結束日期</label>
                        <input type="date" id="trip-end" required class="w-full h-[46px] px-3 border border-slate-200 rounded-xl text-base text-slate-800 bg-white">
                    </div>
                </div>

                <div class="flex items-center justify-end gap-2.5 pt-3 border-t border-slate-100">
                    <button type="button" id="cancel-create-btn" class="w-1/2 py-2.5 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl">取消</button>
                    <button type="submit" id="submit-create-btn" class="w-1/2 py-2.5 text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700 active:scale-95 rounded-xl transition-all">確認建立</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 2. 輸入邀請碼 Modal -->
    <div id="join-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-5 sm:p-6 shadow-2xl space-y-4 border border-slate-100">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <div class="flex items-center gap-2.5">
                    <div class="p-2 bg-emerald-50 text-emerald-600 rounded-xl">
                        <i data-lucide="key-round" class="w-5 h-5"></i>
                    </div>
                    <h3 class="text-base font-bold text-slate-900">輸入邀請碼加入</h3>
                </div>
                <button id="close-join-modal" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-full hover:bg-slate-100">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="join-trip-form" class="space-y-3.5">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">6 位數房間邀請碼</label>
                    <input type="text" id="join-invite-code" maxlength="6" required placeholder="例如：TYO888" class="w-full h-[46px] uppercase text-center font-mono text-xl tracking-widest px-3.5 border border-slate-200 rounded-xl bg-white">
                    <p class="text-[11px] text-slate-400 mt-1.5">向行程管理員索取 6 位數邀請代碼即可加入同行。</p>
                </div>

                <div class="flex items-center justify-end gap-2.5 pt-3 border-t border-slate-100">
                    <button type="button" id="cancel-join-btn" class="w-1/2 py-2.5 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl">取消</button>
                    <button type="submit" id="submit-join-btn" class="w-1/2 py-2.5 text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-700 active:scale-95 rounded-xl transition-all">加入行程</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 首頁專屬邏輯 (原生 ESM 模組引入) -->
    <script type="module">
        import { createTrip, getUserTrips, joinTripByCode } from "./js/api/tripApi.js";

        // 預設當前使用者 (日後串接 Firebase Auth 登入時會自動替換)
        const currentUser = {
            uid: "user_alex_default",
            name: "Alex",
            avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=120"
        };

        let myTrips = [];
        let currentFilter = 'all';

        function showToast(msg) {
            const toast = document.getElementById('toast-message');
            const toastText = document.getElementById('toast-text');
            if (toast && toastText) {
                toastText.innerText = msg;
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.add('hidden'), 2200);
            }
        }

        function getTripStatus(startStr, endStr) {
            const now = new Date().toISOString().split('T')[0];
            if (now > endStr) return 'past';
            if (now >= startStr && now <= endStr) return 'active';
            return 'upcoming';
        }

        function formatSlashDate(dStr) {
            return dStr ? dStr.replace(/-/g, '/') : '';
        }

        async function loadTrips() {
            try {
                myTrips = await getUserTrips(currentUser.uid);
                renderTrips();
                updateCounts();
            } catch (err) {
                showToast("載入行程失敗：" + err.message);
            } finally {
                document.getElementById('loading-state').classList.add('hidden');
            }
        }

        function renderTrips() {
            const grid = document.getElementById('trips-grid');
            const emptyState = document.getElementById('empty-state');

            const filtered = myTrips.filter(trip => {
                const status = getTripStatus(trip.startDate, trip.endDate);
                if (currentFilter === 'all') return true;
                return status === currentFilter;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');
            grid.classList.remove('hidden');

            grid.innerHTML = filtered.map(trip => {
                const status = getTripStatus(trip.startDate, trip.endDate);
                let statusBadge = '';
                if (status === 'active') {
                    statusBadge = `<span class="inline-flex items-center gap-1.5 h-7 px-2.5 rounded-full text-xs font-bold bg-emerald-500 text-white shadow-xs"><span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>進行中</span>`;
                } else if (status === 'upcoming') {
                    statusBadge = `<span class="inline-flex items-center gap-1.5 h-7 px-2.5 rounded-full text-xs font-semibold bg-brand-600 text-white shadow-xs"><i data-lucide="clock" class="w-3.5 h-3.5"></i>即將到來</span>`;
                } else {
                    statusBadge = `<span class="inline-flex items-center gap-1.5 h-7 px-2.5 rounded-full text-xs font-medium bg-slate-800/80 text-white backdrop-blur-md shadow-xs"><i data-lucide="check-circle" class="w-3.5 h-3.5 text-slate-300"></i>已結束</span>`;
                }

                const memberList = trip.members ? Object.values(trip.members) : [];

                return `
                <div onclick="window.location.href='app.html?tripId=${trip.id}'" class="group bg-white rounded-3xl border border-slate-200/80 shadow-xs hover:shadow-md active:scale-[0.99] transition-all duration-200 overflow-hidden cursor-pointer flex flex-col">
                    <div class="relative h-40 w-full overflow-hidden bg-slate-100">
                        <img src="${trip.coverImage}" alt="${trip.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/70 via-transparent to-transparent"></div>
                        
                        <div class="absolute top-3 left-3 flex items-center gap-1.5">
                            <span class="inline-flex items-center gap-1.5 h-7 px-2.5 rounded-full text-xs font-bold bg-white/90 text-slate-800 backdrop-blur-md border border-white/80 shadow-xs">
                                <i data-lucide="map-pin" class="w-3.5 h-3.5 text-brand-600"></i>${trip.country}
                            </span>
                        </div>
                        <div class="absolute top-3 right-3">
                            ${statusBadge}
                        </div>
                    </div>

                    <div class="p-4 flex flex-col justify-between flex-1 space-y-3">
                        <div>
                            <h3 class="font-bold text-base text-slate-900 line-clamp-1 group-hover:text-brand-600 transition-colors">${trip.title}</h3>
                            <p class="text-xs text-slate-500 flex items-center gap-1 mt-1">
                                <i data-lucide="calendar" class="w-3.5 h-3.5 text-slate-400"></i>
                                ${formatSlashDate(trip.startDate)} ~ ${formatSlashDate(trip.endDate)}
                            </p>
                        </div>

                        <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
                            <div class="flex items-center -space-x-1.5 overflow-hidden">
                                ${memberList.slice(0, 3).map(m => `
                                    <img src="${m.avatar}" class="inline-block h-6 w-6 rounded-full ring-2 ring-white object-cover">
                                `).join('')}
                                ${memberList.length > 3 ? `<span class="flex items-center justify-center h-6 w-6 rounded-full ring-2 ring-white bg-slate-100 text-[9px] font-bold text-slate-600">+${memberList.length - 3}</span>` : ''}
                            </div>

                            <div class="flex items-center gap-1 text-xs font-bold text-brand-600 group-hover:translate-x-0.5 transition-transform">
                                進入行程
                                <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');

            if (window.lucide) lucide.createIcons();
        }

        function updateCounts() {
            document.getElementById('count-all').innerText = myTrips.length;
            document.getElementById('count-active').innerText = myTrips.filter(t => getTripStatus(t.startDate, t.endDate) === 'active').length;
            document.getElementById('count-upcoming').innerText = myTrips.filter(t => getTripStatus(t.startDate, t.endDate) === 'upcoming').length;
            document.getElementById('count-past').innerText = myTrips.filter(t => getTripStatus(t.startDate, t.endDate) === 'past').length;
        }

        // 下拉選單開關
        const addBtn = document.getElementById('add-trip-btn');
        const dropdown = document.getElementById('action-dropdown');
        addBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdown.classList.toggle('hidden');
        });
        document.addEventListener('click', () => dropdown.classList.add('hidden'));

        // Modal 控制
        const createModal = document.getElementById('create-modal');
        const joinModal = document.getElementById('join-modal');
        document.getElementById('btn-open-create').addEventListener('click', () => {
            dropdown.classList.add('hidden');
            createModal.classList.remove('hidden');
        });
        document.getElementById('btn-open-join').addEventListener('click', () => {
            dropdown.classList.add('hidden');
            joinModal.classList.remove('hidden');
        });
        document.getElementById('close-create-modal').addEventListener('click', () => createModal.classList.add('hidden'));
        document.getElementById('cancel-create-btn').addEventListener('click', () => createModal.classList.add('hidden'));
        document.getElementById('close-join-modal').addEventListener('click', () => joinModal.classList.add('hidden'));
        document.getElementById('cancel-join-btn').addEventListener('click', () => joinModal.classList.add('hidden'));

        // 提交建立行程
        document.getElementById('create-trip-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-create-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = "建立中...";

            try {
                const title = document.getElementById('trip-title').value;
                const country = document.getElementById('trip-country').value;
                const startDate = document.getElementById('trip-start').value;
                const endDate = document.getElementById('trip-end').value;

                await createTrip({ title, country, startDate, endDate }, currentUser);
                createModal.classList.add('hidden');
                document.getElementById('create-trip-form').reset();
                showToast("成功建立新行程！");
                await loadTrips();
            } catch (err) {
                showToast("建立失敗：" + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "確認建立";
            }
        });

        // 提交加入行程
        document.getElementById('join-trip-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-join-btn');
            const codeInput = document.getElementById('join-invite-code');
            submitBtn.disabled = true;
            submitBtn.innerText = "驗證中...";

            try {
                const res = await joinTripByCode(codeInput.value, currentUser);
                joinModal.classList.add('hidden');
                document.getElementById('join-trip-form').reset();
                showToast(res.alreadyJoined ? "您早已是此行程成員！" : "成功加入行程！");
                await loadTrips();
            } catch (err) {
                showToast(err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "加入行程";
            }
        });

        // 分類切換
        document.querySelectorAll('.tab-filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentFilter = btn.getAttribute('data-filter');
                document.querySelectorAll('.tab-filter-btn').forEach(b => {
                    b.className = "tab-filter-btn flex-1 sm:flex-initial text-center px-3.5 py-1.5 text-xs font-semibold rounded-lg transition-all text-slate-600 whitespace-nowrap";
                });
                btn.className = "tab-filter-btn flex-1 sm:flex-initial text-center px-3.5 py-1.5 text-xs font-semibold rounded-lg transition-all bg-white text-slate-900 shadow-xs whitespace-nowrap";
                renderTrips();
            });
        });

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const future = new Date();
            future.setDate(today.getDate() + 6);
            document.getElementById('trip-start').value = today.toISOString().split('T')[0];
            document.getElementById('trip-end').value = future.toISOString().split('T')[0];
            
            loadTrips();
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>
</html>
